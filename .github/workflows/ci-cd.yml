name: Deploy Dashboard

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Check build
        run: |
          echo "Dashboard build directory:"
          ls -la build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: build/

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download dashboard build
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: build

      - name: Check downloaded build
        run: |
          echo "Downloaded dashboard build:"
          ls -la build

      - name: Deploy dashboard to Nginx
        run: |
          sudo mkdir -p /var/www/dashboard
          sudo rm -rf /var/www/dashboard/*
          sudo cp -r build/* /var/www/dashboard/
